[package]
name = "speaki-box"
version = "0.2.3"
edition = "2024"
authors = ["Levi Laine <shiueo.csh@gmail.com>"]
repository = "https://github.com/levish0/speaki-box"
rust-version = "1.97.1"
description = "스삨이 네르지 마세요"

[features]
default = ["native"]
native = [
    "bevy/multi_threaded",
    "bevy/sysinfo_plugin",
    "bevy/wayland",
    "bevy/x11",
]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_window",
    "bevy_winit",
    "debug",
    "hdr",
    "keyboard",
    "mouse",
    "png",
    "std",
    "tonemapping_luts",
    "webgl2",
] }
rand = "0.10.3"
bevy_kira_audio = { version = "0.27.1", default-features = false, features = ["mp3"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
bevy_embedded_assets = "0.17.0"

# WASM: getrandom needs wasm_js feature for browser RNG
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Native-only dependencies (icon setting)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winit = "0.30.13"

# Windows-only build dependency
[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

# Bevy systems keep injected resources and query filters explicit in their signatures.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[package.metadata.bundle]
name = "Speaki Box"
identifier = "com.levish.speakibox"
icon = ["assets/logo.png"]
category = "Game"
short_description = "A pet 'BOX' featuring Speaki(스피키) characters with physics simulation."
